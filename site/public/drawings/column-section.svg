  <text x="620" y="142" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1a1a1a" letter-spacing="1">MEDIA SCHEDULE</text>
  <g font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1a1a1a">
    <text x="629" y="168" font-weight="bold">NO</text>
    <text x="660" y="168" font-weight="bold">MATERIAL</text>
    <text x="792" y="168" font-weight="bold">DEPTH</text>
    <text x="846" y="168" font-weight="bold">VOL</text>
    <text x="892" y="168" font-weight="bold">MASS</text>

    <text x="632" y="196">1</text><text x="660" y="196">Support gravel 10 mm</text><text x="792" y="196">50</text><text x="846" y="196">221</text><text x="892" y="196">330 g</text>
    <text x="632" y="227">2</text><text x="660" y="227">Biochar, granular</text><text x="792" y="227">120</text><text x="846" y="227">530</text><text x="892" y="227">240 g</text>
    <text x="632" y="258">3</text><text x="660" y="258">Scoria, 0.4&#8211;0.8 mm</text><text x="792" y="258">200</text><text x="846" y="258">883</text><text x="892" y="258">795 g</text>
    <text x="632" y="289">4</text><text x="660" y="289">Scoria, 4&#8211;8 mm</text><text x="792" y="289">50</text><text x="846" y="289">221</text><text x="892" y="289">200 g</text>
  </g>
  <text x="620" y="318" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#555555">Depth in mm &#183; volume in cm&#179; &#183; mass indicative</text>

  <text x="620" y="366" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1a1a1a" letter-spacing="1">NOTES</text>
  <g font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1a1a1a">
    <text x="620" y="388">1.  Place media from the bottom up. Level</text>
    <text x="638" y="404">each layer before adding the next.</text>
    <text x="620" y="428">2.  Geotextile or felt disc cut to bore</text>
    <text x="638" y="444">between every pair of layers.</text>
    <text x="620" y="468">3.  Wash the bed with clean water until the</text>
    <text x="638" y="484">effluent runs clear before the first run.</text>
    <text x="620" y="508">4.  Gravity feed only, top to bottom. Do not</text>
    <text x="638" y="524">pressurise. Connect &#189;&#8221; hose at the valve.</text>
    <text x="620" y="548">5.  Grade the scoria before placing. Record</text>
    <text x="638" y="564">the method and measured fractions.</text>
    <text x="620" y="588">6.  Allow 3 kg raw scoria to yield the</text>
    <text x="638" y="604">graded fractions in the schedule.</text>
  </g>

  <text x="44" y="664" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1a1a1a" letter-spacing="1">SUPPORT ARRANGEMENT</text>
  <text x="44" y="680" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#555555">Two clamps, weighted base.</text>
