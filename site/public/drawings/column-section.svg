  <g font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a">
    <text x="424" y="86" font-weight="bold">COLUMN BODY</text>
    <text x="424" y="101" font-size="11">acrylic tube or stacked PET bottles</text>
    <text x="424" y="132" font-weight="bold">FREEBOARD</text>
    <text x="424" y="220">CHARGE VOLUME &#8212; 884 ml</text>
    <text x="424" y="320" font-weight="bold">4  COARSE SCORIA</text>
    <text x="424" y="420" font-weight="bold">3  FINE SCORIA</text>
    <text x="424" y="548" font-weight="bold">2  BIOCHAR</text>
    <text x="424" y="616" font-weight="bold">1  SUPPORT GRAVEL</text>
    <text x="424" y="656">SCREEN &#8212; plastic mesh</text>
    <text x="424" y="696">VALVE &#189;&#8221; &#8212; plastic stopcock</text>
  </g>
