name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  document:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install doc-engine-cli
      - name: Build the technical document
        run: doc-engine build doc-engine.md -o regolith-water-loop-${{ github.ref_name }}.pdf --force
      - uses: softprops/action-gh-release@v2
        with:
          files: regolith-water-loop-${{ github.ref_name }}.pdf
          generate_release_notes: true

  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
