name: docker

on:
  push:
    branches: [main]
    paths: ["Dockerfile", "site/Dockerfile", "compose.yaml", ".github/workflows/docker.yml"]
  pull_request:
    paths: ["Dockerfile", "site/Dockerfile", "compose.yaml"]

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cli
            context: .
            file: Dockerfile
          - name: site
            context: ./site
            file: ./site/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          load: true
          tags: regolith-water-loop-${{ matrix.name }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
