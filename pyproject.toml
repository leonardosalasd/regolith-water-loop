[project]
name = "regolith-water-loop"
version = "0.1.0"
description = "Turbidity measurement and analysis for a three-stage water pre-treatment column"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = ["numpy>=1.24", "pillow>=10.0"]

[project.scripts]
rwl = "rwl.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rwl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
